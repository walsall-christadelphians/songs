<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hymns">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Psalms, Hymns and Spiritual Songs</title>
<style>
/* VOICE: reverent, quiet, legible at arm's length in a dim church
   IDEA: a cloth-bound pew hymnal — teal cover, white page
   PICTURE: the hymn page itself, set like print; hymns filed A–Z by title
   COLOUR and TYPE: teal cover band, white paper, dark ink; system font throughout
   LAYOUT: cover band with search, then one calm reading column */
:root{color-scheme:light dark;
  --bg:light-dark(#f8fbfb,#0e1515);--ink:light-dark(#132021,#e2ecea);
  --soft:light-dark(#5a6a69,#98aba8);--rule:light-dark(#d9e5e3,#22302f);
  --cover:light-dark(#0f6b6b,#0a3b3c);--on:#f2fbfa;--accent:light-dark(#0f6b6b,#6fd0c6);
  --fs:19px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--cover);color:var(--on);padding:14px max(5vw,16px) 18px;position:sticky;top:0;z-index:2}
.bar{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font:600 clamp(19px,4.5vw,26px)/1.15 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--on);text-decoration:none;margin-inline-end:auto;letter-spacing:.01em}
.search{height:44px;border-radius:10px;border:1px solid #ffffff40;background:#ffffff18;color:var(--on);padding:0 12px;font-size:16px}
.search::placeholder{color:#f3e6e0b0}
.search{flex:1 1 100%}
.btn{height:44px;min-width:44px;border-radius:10px;border:1px solid #ffffff40;background:#ffffff22;color:var(--on);padding:0 12px;cursor:pointer}
.btn:hover{background:#ffffff33}
main{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,44px) max(5vw,16px) 80px}
.list{list-style:none;margin:0;padding:0}
.list a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none}
.list a:hover .t{color:var(--accent)}
.list .t{font:600 22px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.list .m{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.list .txt{flex:1}
.badges{display:flex;gap:6px;flex:none}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff}
.badge svg{width:19px;height:19px}
.b-rec{background:light-dark(#e2563b,#f07a5f)}
.b-chords{background:light-dark(#7a4fd6,#9c7bf0)}
.b-sheet{background:light-dark(#d99a00,#f0b429)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--soft);font-size:14px;margin:0 0 6px;padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .badge{width:24px;height:24px}.legend .badge svg{width:14px;height:14px}
.empty{color:var(--soft);padding:24px 4px}
.hymn-head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:8px}
h1{font:600 clamp(28px,5vw,42px)/1.05 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;text-wrap:balance}
.sub{color:var(--soft);font-size:14px;margin-top:6px}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:12px 0 6px;flex-wrap:wrap}
.tools .btn{background:transparent;color:var(--ink);border-color:var(--rule)}
.tools .btn:hover{background:var(--rule)}
.tabs{position:sticky;top:var(--hh,0px);z-index:1;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-bottom:1px solid var(--rule);margin:8px 0 0}
.tabs button{height:48px;border:0;background:none;font-size:17px;font-weight:600;color:var(--soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.pager{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding-top:6px}
.music-label{color:var(--accent);font-weight:600;font-size:15px;margin:18px 0 10px}
.page{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--rule);border-radius:6px;margin:0 0 12px}
.note a{color:var(--accent)}
.sheet{display:inline-flex;align-items:center;text-decoration:none;margin-inline-end:auto;color:var(--accent)!important;font-size:15px}
.part{margin:28px 0 0;font-size:var(--fs);line-height:1.5}
.label{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.label b{font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--accent)}
.label i{font-size:15px}
.ref{color:var(--soft);font-size:13px;font-style:normal}
.line{margin:0;padding-inline-start:1.4em;text-indent:-1.4em}
.player{display:block;width:100%;margin:14px 0 4px;height:44px}
.chorus{padding-inline-start:1.4em;border-inline-start:3px solid var(--rule)}
.chorus .line{font-style:italic}
.echo{color:var(--soft);font-size:.88em}
.note p{margin:0 0 6px}.credits{color:var(--ink);font-size:14px}
.note{color:var(--soft);font-size:13px;margin-top:44px;border-top:1px solid var(--rule);padding-top:12px}
.hymn-head .sub{padding-inline-start:42px}
.title-row{display:flex;align-items:flex-start;gap:6px;margin-inline-start:-12px}
.back{flex:none;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;margin-top:-6px;border-radius:50%;color:var(--accent);text-decoration:none;font-size:34px;line-height:1}
.back:hover{background:var(--rule)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#index">Psalms, Hymns and Spiritual Songs</a>
    <input class="search" id="q" type="search" placeholder="Search by title, words or reference" aria-label="Search hymns">
  </div>
</header>
<main id="view"></main>

<script>
{
let HYMNS = [];

const view = document.getElementById('view');
const q = document.getElementById('q');
const slug = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\(([^)]+)\)/g, '<span class="echo">($1)</span>');

let fs = 19;
try { fs = +localStorage.getItem('hb-fs') || 19; } catch (e) {}
const setFs = v => { fs = Math.min(30, Math.max(15, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('hb-fs', fs); } catch (e) {} };
setFs(fs);

const text = h => (h.title + ' ' + (h.ref || '') + ' ' + h.parts.map(p => (p.lines || []).join(' ') + ' ' + (p.ref || '') + ' ' + (p.theme || '')).join(' ')).toLowerCase();
const refs = h => h.ref || '';
const isChorus = l => /chorus|refrain/i.test(l);
const credits = h => [h.words && 'Words: ' + h.words, h.music && 'Music: ' + h.music, h.source, h.year && '© ' + h.year].filter(Boolean).join(' · ');

const ICONS = {
  rec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.5" fill="currentColor"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5" fill="currentColor"/></svg>',
  chords: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h14M6 4v16M10 4v16M14 4v16M18 4v16M6 9h12M6 14h12"/><circle cx="10" cy="11.5" r="2" fill="currentColor" stroke="none"/><circle cx="14" cy="16.5" r="2" fill="currentColor" stroke="none"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4.5 20 2v13.5a3 3 0 1 1-2-2.83V6.6l-7 1.6v9.3a3 3 0 1 1-2-2.83z"/></svg>'
};
const KINDS = { rec: 'Recording', chords: 'Chords', sheet: 'Sheet music' };
const badge = (k, size) => `<span class="badge b-${k}" title="${KINDS[k]}" role="img" aria-label="${KINDS[k]}">${ICONS[k]}</span>`;
const kinds = h => [h.audio && 'rec', h.sheet && (/^chords/i.test(h.sheetLabel) ? 'chords' : 'sheet')].filter(Boolean);

function renderIndex(term = '') {
  const t = term.trim().toLowerCase();
  const hits = HYMNS.filter(h => !t || text(h).includes(t));
  const legend = `<p class="legend">${Object.keys(KINDS).map(k => `<span>${badge(k)}${KINDS[k]}</span>`).join('')}</p>`;
  view.innerHTML = hits.length
    ? legend + `<ul class="list">${hits.map(h => `<li><a href="#${h.id}"><span class="txt"><span class="t">${esc(h.title)}</span><span class="m">${esc(refs(h))}</span></span><span class="badges">${kinds(h).map(k => badge(k)).join('')}</span></a></li>`).join('')}</ul>`
    : `<p class="empty">No hymns match “${esc(term)}”.</p>`;
}

function renderHymn(h) {
  const parts = h.parts.map(p => {
    const src = p.repeat ? h.parts.find(x => x.label === p.label && x.lines) : p;
    const lines = src.lines;
    return `<section class="part ${isChorus(p.label) ? 'chorus' : ''}">
      ${p.label || p.theme || p.ref ? `<div class="label"><b>${esc(p.label)}</b>${p.theme ? `<i>${esc(p.theme)}</i>` : ''}${p.ref ? `<span class="ref">${esc(p.ref)}</span>` : ''}</div>` : ''}
      ${lines.map(l => `<p class="line">${fmt(l)}</p>`).join('')}
    </section>`;
  }).join('');
  const words = `${h.audio ? `<audio class="player" controls preload="none" src="${esc(h.audio)}"></audio>` : ''}
    <div class="tools">
      <button class="btn" id="smaller" aria-label="Smaller text">A−</button>
      <button class="btn" id="bigger" aria-label="Larger text">A+</button>
    </div>
    ${parts}
    <footer class="note">${credits(h) ? `<p class="credits">${esc(credits(h))}</p>` : ''}<p>Words in brackets are echoes or directions.${h.note ? ' ' + esc(h.note) : ''}</p></footer>`;
  const head = `<div class="hymn-head"><div class="title-row"><a class="back" href="#index" aria-label="All songs" title="All songs">←</a><h1>${esc(h.title)}</h1></div>${h.ref && h.ref !== h.title ? `<div class="sub">${esc(h.ref)}</div>` : ''}</div>`;
  if (!h.sheetPages) {
    view.innerHTML = head + words;
  } else {
    const music = `<p class="music-label">${esc(h.sheetLabel)}</p>
      ${h.sheetPages.map((src, i) => `<img class="page" src="${esc(src)}" alt="${esc(h.sheetLabel)}, page ${i + 1} of ${h.sheetPages.length}" loading="lazy">`).join('')}
      <p class="note"><a href="${esc(h.sheet)}" target="_blank" rel="noopener">Open as PDF</a> to print or zoom in.</p>`;
    view.innerHTML = head + `<div class="tabs" role="tablist">
        <button role="tab" id="tab-0" aria-controls="panel-0" aria-selected="true">Words</button>
        <button role="tab" id="tab-1" aria-controls="panel-1" aria-selected="false" tabindex="-1">Music</button>
      </div>
      <div class="pager" id="pager">
        <section class="panel" id="panel-0" role="tabpanel" aria-labelledby="tab-0">${words}</section>
        <section class="panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">${music}</section>
      </div>`;
    setupTabs();
  }
  document.getElementById('smaller').onclick = () => setFs(fs - 2);
  document.getElementById('bigger').onclick = () => setFs(fs + 2);
  window.scrollTo(0, 0);
}

const headerEl = document.querySelector('header');
const headerH = () => headerEl.offsetHeight;
new ResizeObserver(() => document.documentElement.style.setProperty('--hh', headerH() + 'px')).observe(headerEl);
let pagerObserver;
function setupTabs() {
  const pager = document.getElementById('pager');
  const panels = [...pager.children];
  const tabs = [...document.querySelectorAll('.tabs [role=tab]')];
  let current = 0;
  const fit = () => { pager.style.height = panels[current].offsetHeight + 'px'; };
  const select = (i, scroll) => {
    current = i;
    tabs.forEach((t, j) => { t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; });
    panels.forEach((p, j) => p.inert = j !== i);
    if (scroll) pager.scrollTo({ left: i * pager.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    fit();
    const target = pager.getBoundingClientRect().top + window.scrollY - headerH() - document.querySelector('.tabs').offsetHeight;
    if (window.scrollY > target) window.scrollTo(0, target);
  };
  tabs.forEach((t, i) => {
    t.onclick = () => select(i, true);
    t.onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = e.key === 'ArrowRight' ? 1 : 0; select(n, true); tabs[n].focus(); } };
  });
  let timer;
  pager.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { const i = Math.round(pager.scrollLeft / pager.clientWidth); if (i !== current) select(i, false); }, 80);
  }, { passive: true });
  if (pagerObserver) pagerObserver.disconnect();
  pagerObserver = new ResizeObserver(fit);
  panels.forEach(p => pagerObserver.observe(p));
  panels[1].inert = true;
  fit();
}

function route() {
  const id = location.hash.slice(1);
  const h = id && HYMNS.find(x => x.id === id);
  if (h) { q.value = ''; renderHymn(h); } else renderIndex(q.value);
}

q.addEventListener('input', () => { if (HYMNS.some(x => '#' + x.id === location.hash)) location.hash = 'index'; renderIndex(q.value); });
addEventListener('hashchange', route);
view.innerHTML = '<p class="empty">Loading…</p>';
fetch('songs.json').then(r => r.json()).then(list => {
  HYMNS = list.sort((a, b) => a.title.localeCompare(b.title, 'en-GB'));
  route();
}).catch(() => { view.innerHTML = '<p class="empty">Couldn’t load the songs. Check your connection and try again.</p>'; });

if ('serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
}
</script>
</body>
</html>
