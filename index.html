<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hymns">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hymnbook</title>
<style>
/* VOICE: reverent, quiet, legible at arm's length in a dim church
   IDEA: a cloth-bound pew hymnal — teal cover, white page
   PICTURE: the hymn page itself, set like print; hymns filed A–Z by title
   COLOUR and TYPE: teal cover band, white paper, dark ink; system font throughout
   LAYOUT: cover band with search, then one calm reading column */
:root{color-scheme:light dark;
  --bg:light-dark(#f8fbfb,#0e1515);--ink:light-dark(#132021,#e2ecea);
  --soft:light-dark(#5a6a69,#98aba8);--rule:light-dark(#d9e5e3,#22302f);
  --cover:light-dark(#0f6b6b,#0a3b3c);--on:#f2fbfa;--accent:light-dark(#0f6b6b,#6fd0c6);
  --fs:19px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--cover);color:var(--on);padding:14px max(5vw,16px) 18px;position:sticky;top:0;z-index:2}
.bar{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font:600 26px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--on);text-decoration:none;margin-inline-end:auto;letter-spacing:.01em}
.search{height:44px;border-radius:10px;border:1px solid #ffffff40;background:#ffffff18;color:var(--on);padding:0 12px;font-size:16px}
.search::placeholder{color:#f3e6e0b0}
.search{flex:1 1 100%}
.btn{height:44px;min-width:44px;border-radius:10px;border:1px solid #ffffff40;background:#ffffff22;color:var(--on);padding:0 12px;cursor:pointer}
.btn:hover{background:#ffffff33}
main{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,44px) max(5vw,16px) 80px}
.list{list-style:none;margin:0;padding:0}
.list a{display:block;align-items:baseline;padding:14px 4px;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none}
.list a:hover .t{color:var(--accent)}
.list .t{font:600 22px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.list .m{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.empty{color:var(--soft);padding:24px 4px}
.hymn-head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:8px}
h1{font:600 clamp(28px,5vw,42px)/1.05 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;text-wrap:balance}
.sub{color:var(--soft);font-size:14px;margin-top:6px}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:12px 0 6px;flex-wrap:wrap}
.tools .btn{background:transparent;color:var(--ink);border-color:var(--rule)}
.tools .btn:hover{background:var(--rule)}
.part{margin:28px 0 0;font-size:var(--fs);line-height:1.5}
.label{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.label b{font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--accent)}
.label i{font-size:15px}
.ref{color:var(--soft);font-size:13px;font-style:normal}
.line{margin:0;padding-inline-start:1.4em;text-indent:-1.4em}
.player{display:block;width:100%;margin:14px 0 4px;height:44px}
.chorus{padding-inline-start:1.4em;border-inline-start:3px solid var(--rule)}
.chorus .line{font-style:italic}
.echo{color:var(--soft);font-size:.88em}
.note{color:var(--soft);font-size:13px;margin-top:44px;border-top:1px solid var(--rule);padding-top:12px}
.back{display:inline-flex;align-items:center;height:44px;color:var(--accent);text-decoration:none;font-size:15px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#index">Hymnbook</a>
    <input class="search" id="q" type="search" placeholder="Search by title, words or reference" aria-label="Search hymns">
  </div>
</header>
<main id="view"></main>

<script>
{
let HYMNS = [];

const view = document.getElementById('view');
const q = document.getElementById('q');
const slug = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\(([^)]+)\)/g, '<span class="echo">($1)</span>');

let fs = 19;
try { fs = +localStorage.getItem('hb-fs') || 19; } catch (e) {}
const setFs = v => { fs = Math.min(30, Math.max(15, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('hb-fs', fs); } catch (e) {} };
setFs(fs);

const text = h => (h.title + ' ' + (h.ref || '') + ' ' + h.parts.map(p => (p.lines || []).join(' ') + ' ' + (p.ref || '') + ' ' + (p.theme || '')).join(' ')).toLowerCase();
const refs = h => h.ref || '';
const isChorus = l => /chorus|refrain/i.test(l);
const credits = h => [h.words && 'Words: ' + h.words, h.music && 'Music: ' + h.music, h.source, h.year && '© ' + h.year].filter(Boolean).join(' · ');

function renderIndex(term = '') {
  const t = term.trim().toLowerCase();
  const hits = HYMNS.filter(h => !t || text(h).includes(t));
  view.innerHTML = hits.length
    ? `<ul class="list">${hits.map(h => `<li><a href="#${h.id}"><span><span class="t">${esc(h.title)}</span><span class="m">${esc(refs(h))}${h.audio ? ' · ♪ recording' : ''}</span></span></a></li>`).join('')}</ul>`
    : `<p class="empty">No hymns match “${esc(term)}”.</p>`;
}

function renderHymn(h) {
  const parts = h.parts.map(p => {
    const src = p.repeat ? h.parts.find(x => x.label === p.label && x.lines) : p;
    const lines = src.lines;
    return `<section class="part ${isChorus(p.label) ? 'chorus' : ''}">
      ${p.label || p.theme || p.ref ? `<div class="label"><b>${esc(p.label)}</b>${p.theme ? `<i>${esc(p.theme)}</i>` : ''}${p.ref ? `<span class="ref">${esc(p.ref)}</span>` : ''}</div>` : ''}
      ${lines.map(l => `<p class="line">${fmt(l)}</p>`).join('')}
    </section>`;
  }).join('');
  view.innerHTML = `<a class="back" href="#index">← All hymns</a>
    <div class="hymn-head"><h1>${esc(h.title)}</h1>${h.ref ? `<div class="sub">${esc(h.ref)}</div>` : ''}${credits(h) ? `<div class="sub">${esc(credits(h))}</div>` : ''}</div>
    ${h.audio ? `<audio class="player" controls preload="none" src="${esc(h.audio)}"></audio>` : ''}
    <div class="tools">
      <button class="btn" id="smaller" aria-label="Smaller text">A−</button>
      <button class="btn" id="bigger" aria-label="Larger text">A+</button>
    </div>
    ${parts}
    <p class="note">Words in brackets are echoes or directions.${h.note ? ' ' + esc(h.note) : ''}</p>`;
  document.getElementById('smaller').onclick = () => setFs(fs - 2);
  document.getElementById('bigger').onclick = () => setFs(fs + 2);
  window.scrollTo(0, 0);
}

function route() {
  const id = location.hash.slice(1);
  const h = id && HYMNS.find(x => x.id === id);
  if (h) { q.value = ''; renderHymn(h); } else renderIndex(q.value);
}

q.addEventListener('input', () => { if (HYMNS.some(x => '#' + x.id === location.hash)) location.hash = 'index'; renderIndex(q.value); });
addEventListener('hashchange', route);
view.innerHTML = '<p class="empty">Loading…</p>';
fetch('songs.json').then(r => r.json()).then(list => {
  HYMNS = list.sort((a, b) => a.title.localeCompare(b.title, 'en-GB'));
  route();
}).catch(() => { view.innerHTML = '<p class="empty">Couldn’t load the songs. Check your connection and try again.</p>'; });

if ('serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
}
</script>
</body>
</html>
